
name: Render proof of concept

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

           - name: Install FFmpeg
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "===== CHECK FFMPEG FILE ====="
          ls -l /usr/bin/ffmpeg
          /usr/bin/ffmpeg -version | head -n 1

          echo "===== CHECK FFPROBE FILE ====="
          ls -l /usr/bin/ffprobe
          /usr/bin/ffprobe -version | head -n 1

          echo "/usr/bin" >> "$GITHUB_PATH"
          

          echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify FFmpeg before rendering
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="/usr/bin:/usr/local/bin:$PATH"

          echo "===== FFMPEG PATH ====="
          command -v ffmpeg
          which ffmpeg
          ffmpeg -version | head -n 1

          echo "===== FFPROBE PATH ====="
          command -v ffprobe

          python -c "import shutil; print('Python FFmpeg path:', shutil.which('ffmpeg')); assert shutil.which('ffmpeg')"

      - name: Render 10 second video
        run: |
          set -euxo pipefail
          python src/poc.py

      - name: Verify generated MP4
        shell: bash
        run: |
          set -euxo pipefail

          test -s out/poc.mp4

          echo "===== VIDEO DETAILS ====="
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            out/poc.mp4

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of csv=p=0 \
            out/poc.mp4

          DUR=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            out/poc.mp4)

          python -c "import sys; d=float('$DUR'); print(f'Duration: {d:.2f}s'); sys.exit(0 if 9.9 <= d <= 10.1 else 1)"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: poc-video
          path: out/poc.mp4
          if-no-files-found: error
          
